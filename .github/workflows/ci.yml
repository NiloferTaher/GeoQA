name: CI

# The pre-push hook protects the maintainer's machine. This protects everyone
# else's: a reviewer who clones the repository gets the same gate, without
# having to trust the contributor's account of what they ran.
#
# On failure, every step writes the tail of its own output to the job summary.
# That exists because a red X with no visible cause costs more time than it
# saves: the log is behind a click, and reading it is not obvious to whoever
# is waiting on the run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "60000"

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Environment
        run: |
          set -x
          python --version
          pip --version
          {
            echo "### Python environment"
            echo '```'
            python --version
            pip --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: |
          set -x
          pip install -e ".[all,dev]" 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Install failed (exit $status)"
              echo '```'
              tail -n 60 install.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Compile
        run: |
          set -x
          python -m compileall -q geoqa geoai

      - name: Test
        run: |
          set -x
          python -m pytest -q --no-header 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Tests failed (exit $status)"
              echo '```'
              grep -E '^(FAILED|ERROR)' test.log | head -40
              echo '```'
              echo ""
              echo "<details><summary>Last 80 lines</summary>"
              echo ""
              echo '```'
              tail -n 80 test.log
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Module documentation is current
        run: |
          set -x
          python tools/generate_module_docs.py --check

  atlas:
    name: Atlas front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Environment
        run: |
          set -x
          node --version
          npm --version
          {
            echo "### Node environment"
            echo '```'
            node --version
            npm --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # npm ci refuses to install when the lockfile disagrees with the
      # manifest, which is the behaviour it exists for. When it refuses for a
      # reason the lockfile cannot express, the run continues with npm install
      # and says so, because a build that never runs tells nobody less than a
      # build that runs with a weaker guarantee.
      - name: Install
        run: |
          set -x
          npm ci --no-audit --no-fund 2>&1 | tee ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm ci failed (exit $status), falling back to npm install"
              echo '```'
              tail -n 40 ci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::npm ci failed; retrying with npm install"
            npm install --no-audit --no-fund 2>&1 | tee install.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              {
                echo "### npm install also failed"
                echo '```'
                tail -n 60 install.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Build
        run: |
          set -x
          npm run build

      - name: Test
        run: |
          set -x
          npm test

  privacy:
    name: No private material
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protected paths are absent from the tree
        run: |
          found=0
          for path in docs/wuc-2027 reports/wuc-2027 apps/wuc-atlas reruns api_key.txt; do
            if git ls-tree -r --name-only HEAD | grep -q "^$path"; then
              echo "PROTECTED PATH COMMITTED: $path"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "Conference submission material must not be published."
            exit 1
          fi
          echo "No protected paths in the tree."

      - name: No absolute local paths in tracked source
        run: |
          # The pattern is not spelled out in a comment, because this workflow
          # would otherwise trip its own check.
          hits=$(git grep -l -I -E '[A-Za-z]:\\Users\\' HEAD -- \
            '*.py' '*.md' '*.ts' '*.tsx' '*.json' '*.yml' '*.yaml' || true)
          if [ -n "$hits" ]; then
            echo "Absolute Windows paths found in tracked files:"
            echo "$hits"
            exit 1
          fi
          echo "No absolute local paths."

      - name: No credential patterns in tracked source
        run: |
          # This workflow is excluded because it holds the patterns themselves.
          # The three test files that exercise the credential detector are
          # listed by name with the reason, so adding a fixture is deliberate.
          allow="^(\.github/|tests/test_credentials\.py|tests/test_ai_guard\.py|tests/test_runtime_packages\.py)"
          hits=$(git grep -l -I -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{12,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' HEAD -- \
            '*.py' '*.md' '*.ts' '*.tsx' '*.json' '*.yml' '*.yaml' '*.sh' \
            | sed 's|^HEAD:||' | grep -vE "$allow" || true)
          if [ -n "$hits" ]; then
            echo "Possible credentials found in tracked files:"
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "No credential patterns outside the declared fixtures."