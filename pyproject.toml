[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoqa"
version = "0.4.0"
description = "Geospatial data quality validation, conservative fixes, reporting, and local QA workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# The License :: classifier is deliberately absent. PEP 639 superseded it with
# the SPDX expression above, and setuptools refuses to configure a project that
# declares both. That refusal is the whole reason CI could not install this
# package.
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas",
    "shapely",
    "pyproj",
    "psutil",
]

[project.optional-dependencies]
# Declared per data format rather than bundled, so validating a GeoPackage
# does not drag in a hyperspectral reader. Each module already imports its
# own dependency lazily and raises a message naming the extra to install.
tabular = [
    "pandas",
    "numpy",
]
raster = [
    "numpy",
    "rasterio",
]
excel = [
    "openpyxl",
]
# GeoParquet read/write needs pyarrow. It is a hard requirement of the format,
# not of the library, so it stays optional and named here.
parquet = [
    "pyarrow",
]
hyperspectral = [
    "numpy",
    "h5py",
]
# The Streamlit front end ships with the repository but is not part of the
# library import graph, so the web stack stays optional. Install this to run
# streamlit_app.py from a checkout.
app = [
    "streamlit",
    "streamlit-folium",
    "folium",
]
web = [
    "pandas",
    "xlsxwriter",
]
charts = [
    "plotly",
    "matplotlib",
]
all = [
    "pandas",
    "numpy",
    "rasterio",
    "openpyxl",
    "pyarrow",
    "h5py",
    "xlsxwriter",
    "plotly",
    "matplotlib",
]
dev = [
    "jupyter",
    "build",
    "pytest",
]
geoai-jax = [
    "jax",
]

[project.scripts]
geoqa = "geoqa.cli.main:run"

[tool.setuptools.packages.find]
include = ["geoqa*", "geoai*", "geoqa_web*"]

# The site and slide templates are read from disk at runtime, so they must ship
# inside the wheel. Without this, geoqa_web imports fine and then fails with
# FileNotFoundError the moment a site is built.
[tool.setuptools.package-data]
geoqa_web = ["templates/*.html"]
# PEP 561 marker, so type checkers see the annotations the library ships.
geoqa = ["py.typed"]
"*" = ["*.json", "*.css"]
