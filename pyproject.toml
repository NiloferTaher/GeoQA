[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoqa"
version = "0.3.0"
description = "Geospatial data quality validation, conservative fixes, reporting, and local QA workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "geopandas",
    "shapely",
    "pyproj",
    "psutil",
]

[project.optional-dependencies]
# Declared per data format rather than bundled, so validating a GeoPackage
# does not drag in a hyperspectral reader. Each module already imports its
# own dependency lazily and raises a message naming the extra to install.
tabular = [
    "pandas",
    "numpy",
]
raster = [
    "numpy",
    "rasterio",
]
excel = [
    "openpyxl",
]
hyperspectral = [
    "numpy",
    "h5py",
]
# The local Streamlit front end is not published with the library, so the
# web stack is optional. Install this to run it from a local checkout.
app = [
    "streamlit",
    "streamlit-folium",
    "folium",
]
all = [
    "pandas",
    "numpy",
    "rasterio",
    "openpyxl",
    "h5py",
]
dev = [
    "jupyter",
    "build",
    "pytest",
]
geoai-jax = [
    "jax",
]

[project.scripts]
geoqa = "geoqa.cli.main:run"

[tool.setuptools.packages.find]
include = ["geoqa*", "geoai*"]
